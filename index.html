<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    ai-studio-widget {
      position: static !important;
      display: block !important;
      width: 100% !important;
      height: 100vh !important;
    }
    ai-studio-widget iframe,
    ai-studio-widget > * {
      position: static !important;
      width: 100% !important;
      height: 100% !important;
    }
    body > *:not(script) {
      position: static !important;
    }
  </style>
</head>
<body>
  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>
  <script>
    var clickTimer = setInterval(function() {
      var widget = document.querySelector('ai-studio-widget');
      if (!widget) return;
      var sr = widget.shadowRoot;
      if (!sr) return;
      var orb = sr.querySelector('.orb-button');
      if (orb) {
        clearInterval(clickTimer);
        setTimeout(function() {
          orb.click();
          setTimeout(function() {
            var style = document.createElement('style');
            style.id = 'panel-expand';
            style.textContent = ':host { position: static !important; width: 100% !important; height: 100vh !important; } .panel { width: 100% !important; height: 100vh !important; max-width: 100% !important; max-height: 100% !important; border-radius: 0 !important; box-shadow: none !important; position: static !important; } .panel-header { border-radius: 0 !important; }';
            sr.appendChild(style);
          }, 500);
        }, 100);
      }
    }, 300);
    setTimeout(function() { clearInterval(clickTimer); }, 15000);
  </script>
</body>
</html>
