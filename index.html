<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }
    .logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
      z-index: 10;
    }
    .logo span { color: #04888A; }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

  <script>
    function centerWidget() {
      // Find every element the widget may have created
      const targets = [
        document.querySelector('ai-studio-widget'),
        ...document.querySelectorAll('body > div'),
        ...document.querySelectorAll('body > section'),
        ...document.querySelectorAll('body > iframe')
      ].filter(Boolean);

      targets.forEach(el => {
        const style = window.getComputedStyle(el);
        // Only move elements that are fixed or absolute (the widget launcher)
        if (style.position === 'fixed' || style.position === 'absolute' || el.tagName === 'AI-STUDIO-WIDGET') {
          el.style.setProperty('position', 'fixed', 'important');
          el.style.setProperty('top', '50%', 'important');
          el.style.setProperty('left', '50%', 'important');
          el.style.setProperty('bottom', 'auto', 'important');
          el.style.setProperty('right', 'auto', 'important');
          el.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
          el.style.setProperty('z-index', '999', 'important');
        }
      });

      // Also inject style into shadow root if accessible
      const widget = document.querySelector('ai-studio-widget');
      if (widget && widget.shadowRoot) {
        const styleEl = document.createElement('style');
        styleEl.textContent = `
          :host { 
            position: fixed !important; 
            top: 50% !important; 
            left: 50% !important;
            bottom: auto !important;
            right: auto !important;
            transform: translate(-50%, -50%) !important;
          }
          * { 
            bottom: auto !important; 
            right: auto !important; 
          }
        `;
        widget.shadowRoot.appendChild(styleEl);
      }
    }

    // Run on load and repeatedly
    new MutationObserver(centerWidget).observe(document.body, { childList: true, subtree: true });
    [100, 500, 1000, 2000, 3000].forEach(d => setTimeout(centerWidget, d));
  </script>

</body>
</html>
