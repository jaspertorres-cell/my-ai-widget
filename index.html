<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    /* Top section: logo */
    .top {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
    }
    .logo span { color: #04888A; }

    /* Middle section: widget fills remaining height */
    .middle {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    ai-studio-widget {
      position: static !important;
      display: block !important;
      width: clamp(320px, 90vw, 576px) !important;
      height: 100% !important;
      min-height: 480px !important;
    }

    ai-studio-widget iframe,
    ai-studio-widget > * {
      position: static !important;
      width: 100% !important;
      height: 100% !important;
    }

    body > *:not(.page) {
      position: static !important;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="top">
      <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>
    </div>

    <div class="middle">
      <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
    </div>

  </div>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>
</body>
</html>
