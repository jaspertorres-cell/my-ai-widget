<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Press Release Intake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      padding: 32px;
      width: 100%;
      max-width: 520px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 28px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      color: #202124;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      font-family: Arial, sans-serif;
    }
    input:focus, textarea:focus {
      border-color: #1a73e8;
    }
    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }
    button {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    button:hover { background: #1558b0; }
    button:disabled { background: #a8c7fa; cursor: default; }
    .success {
      display: none;
      margin-top: 16px;
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #a8d5b5;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
    }
    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Press release intake</h1>
    <p class="subtitle">Fill out the form below and hit Submit. Your response will be recorded automatically.</p>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name" required />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@8x8.com" required />
    </div>

    <div class="field">
      <label for="announcement">Announcement</label>
      <textarea id="announcement" placeholder="Describe the announcement..." required></textarea>
    </div>

    <button id="submitBtn" onclick="submitForm()">Submit</button>

    <div class="success" id="successMsg">
      Submitted. Your response has been recorded.
    </div>

    <p class="note">This form submits directly to Google Forms in the background. You will not be redirected.</p>
  </div>

  <script>
    async function submitForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const announcement = document.getElementById('announcement').value.trim();

      if (!name || !email || !announcement) {
        alert('Please fill in all fields before submitting.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData();
      formData.append('entry.2110480778', name);
      formData.append('entry.348297233', email);
      formData.append('entry.369417261', announcement);

      try {
        await fetch(
          'https://docs.google.com/forms/u/0/d/e/1FAIpQLSci64bKkbXf8SJVTB4wx04prPvyOPCPd2EeMzPyEt8arOTpbw/formResponse',
          { method: 'POST', mode: 'no-cors', body: formData }
        );
      } catch (e) {
        // no-cors always resolves; errors here are rare network failures
      }

      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('announcement').value = '';
      document.getElementById('successMsg').style.display = 'block';

      btn.disabled = false;
      btn.textContent = 'Submit another';
      btn.onclick = function() {
        document.getElementById('successMsg').style.display = 'none';
        btn.textContent = 'Submit';
        btn.onclick = submitForm;
      };
    }
  </script>
</body>
</html>
