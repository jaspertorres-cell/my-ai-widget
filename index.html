<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }

    .logo {
      text-align: center;
      padding: 24px 0 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
    }
    .logo span { color: #04888A; }

    /* Force widget static so it stays in flow */
    ai-studio-widget {
      position: static !important;
      display: block !important;
      width: clamp(320px, 90vw, 576px) !important;
      height: calc(100vh - 100px) !important;
      min-height: 480px !important;
    }

    ai-studio-widget iframe,
    ai-studio-widget > * {
      position: static !important;
      width: 100% !important;
      height: 100% !important;
    }

    body > *:not(.logo):not(.container) {
      position: static !important;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 80px);
    }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <div class="container">
    <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  </div>

  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

</body>
</html>
