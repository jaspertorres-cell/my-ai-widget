<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
      z-index: 10;
    }

    .logo span { color: #04888A; }

    ai-studio-widget {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 999 !important;
      display: block !important;
    }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
