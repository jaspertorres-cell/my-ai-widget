<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #smartheader {
      width: 100%;
      padding: 10px 16px;
      background: #3A3A38;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 99999;
    }
    #smartheader .logo {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
    }
    #smartheader .logo span { color: #8EBEB1; }
    #smartheader .label {
      font-size: 11px;
      font-weight: 600;
      color: #8EBEB1;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    ai-studio-widget {
      position: static !important;
      display: block !important;
    }
    ai-studio-widget iframe,
    ai-studio-widget > * {
      position: static !important;
    }
  </style>
</head>
<body>
  <div id="smartheader">
    <div class="logo">8<span>x</span>8<sup style="font-size:8px;vertical-align:super;">®</sup></div>
    <div class="label">Smart Assist</div>
  </div>
  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>
  <script>
    var PANEL_CSS = ':host{position:static!important;width:100%!important;height:calc(100vh - 44px)!important}.panel{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;border-radius:0!important;box-shadow:none!important;position:static!important}.panel-header{border-radius:0!important}';
    var orbClicked = false;
    var styleInjected = false;

    setInterval(function() {
      var widget = document.querySelector('ai-studio-widget');
      if (!widget) return;
      var sr = widget.shadowRoot;
      if (!sr) return;

      // Inject style FIRST — before any click
      if (!sr.getElementById('pe')) {
        var s = document.createElement('style');
        s.id = 'pe';
        s.textContent = PANEL_CSS;
        sr.appendChild(s);
      }

      // Then click orb
      if (!orbClicked) {
        var orb = sr.querySelector('.orb-button');
        if (orb) {
          orb.click();
          orbClicked = true;
        }
      }
    }, 500);
  </script>
</body>
</html>
