<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
      z-index: 10;
    }

    .logo span { color: #04888A; }

    /* Center the widget bubble */
    ai-studio-widget {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 999 !important;
      display: block !important;
    }

    /* Center any iframe the widget injects into body */
    body > iframe {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: clamp(320px, 90vw, 576px) !important;
      height: calc(100vh - 120px) !important;
      min-height: 480px !important;
      max-height: 720px !important;
      border: none !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 40px rgba(4,136,138,0.18) !important;
      z-index: 9999 !important;
    }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

  <script>
    function deepClick(root) {
      if (!root) return false;
      // Try every possible clickable element
      const selectors = [
        'button', '[role="button"]', '[class*="launch"]',
        '[class*="bubble"]', '[class*="trigger"]', '[class*="toggle"]',
        '[class*="open"]', '[class*="chat"]', 'svg', 'img'
      ];
      for (const sel of selectors) {
        const el = root.querySelector ? root.querySelector(sel) : null;
        if (el) { el.click(); return true; }
      }
      return false;
    }

    function tryOpen() {
      const widget = document.querySelector('ai-studio-widget');
      if (!widget) return;

      // 1. Try shadow root
      if (widget.shadowRoot) {
        if (deepClick(widget.shadowRoot)) return;
        // Go deeper into nested shadow roots
        widget.shadowRoot.querySelectorAll('*').forEach(el => {
          if (el.shadowRoot) deepClick(el.shadowRoot);
        });
      }

      // 2. Try direct children
      deepClick(widget);

      // 3. Try anything added to body by the script
      document.querySelectorAll('body > div, body > section').forEach(el => {
        deepClick(el);
      });
    }

    // Watch DOM for widget elements being added
    new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.nodeType !== 1) continue;
          if (node.tagName === 'IFRAME') {
            // Chat iframe was injected — style it centered
            node.style.cssText = `
              position: fixed !important;
              top: 50% !important;
              left: 50% !important;
              transform: translate(-50%, -50%) !important;
              width: clamp(320px, 90vw, 576px) !important;
              height: calc(100vh - 120px) !important;
              min-height: 480px !important;
              max-height: 720px !important;
              border: none !important;
              border-radius: 12px !important;
              box-shadow: 0 8px 40px rgba(4,136,138,0.18) !important;
              z-index: 9999 !important;
            `;
          }
          // Try clicking buttons in newly added nodes
          setTimeout(() => deepClick(node), 100);
        }
      }
    }).observe(document.body, { childList: true, subtree: true });

    // Retry clicking at intervals
    [500, 1000, 1500, 2000, 3000, 4000, 5000].forEach(d => setTimeout(tryOpen, d));
  </script>

</body>
</html>
