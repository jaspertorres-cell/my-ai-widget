<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
      z-index: 10;
    }

    .logo span { color: #04888A; }

    /* Force anything the widget injects to be centered */
    ai-studio-widget {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: clamp(320px, 90vw, 576px) !important;
      height: calc(100vh - 120px) !important;
      min-height: 480px !important;
      max-height: 720px !important;
      z-index: 999 !important;
      display: block !important;
    }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

  <script>
    // Auto-click the widget open after it loads
    function tryOpen() {
      const widget = document.querySelector('ai-studio-widget');
      if (!widget) return;

      // Check shadow root
      if (widget.shadowRoot) {
        const btn = widget.shadowRoot.querySelector('button, [role="button"], [class*="launch"], [class*="bubble"], [class*="trigger"]');
        if (btn) { btn.click(); return; }
      }

      // Check body-level injected elements
      document.querySelectorAll('body > *:not(script):not(link):not(style) button, body > *:not(script) [role="button"]')
        .forEach(btn => btn.click());
    }

    [800, 1500, 2500, 4000].forEach(d => setTimeout(tryOpen, d));
  </script>

</body>
</html>
