
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist - Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background-color: #EBEAE1; font-family: sans-serif; }
    #debug {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      font-size: 11px;
      font-family: monospace;
      padding: 10px;
      max-height: 40vh;
      overflow-y: auto;
      z-index: 99999;
    }
  </style>
</head>
<body>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

  <div id="debug">Waiting for widget to load...</div>

  <script>
    const log = (msg) => {
      const d = document.getElementById('debug');
      d.innerHTML += '<br>' + msg;
    };

    function inspect() {
      const lines = [];

      // All direct body children
      const bodyChildren = Array.from(document.body.children);
      lines.push('=== BODY CHILDREN ===');
      bodyChildren.forEach((el, i) => {
        const s = window.getComputedStyle(el);
        const r = el.getBoundingClientRect();
        lines.push(`[${i}] <${el.tagName.toLowerCase()}> id="${el.id}" class="${el.className}"`);
        lines.push(`  position:${s.position} top:${s.top} left:${s.left} right:${s.right} bottom:${s.bottom}`);
        lines.push(`  rect: x=${Math.round(r.x)} y=${Math.round(r.y)} w=${Math.round(r.width)} h=${Math.round(r.height)}`);
        lines.push(`  display:${s.display} visibility:${s.visibility} opacity:${s.opacity}`);
      });

      // Shadow root inspection
      const widget = document.querySelector('ai-studio-widget');
      if (widget) {
        lines.push('=== AI-STUDIO-WIDGET SHADOW ROOT ===');
        const sr = widget.shadowRoot;
        if (sr) {
          Array.from(sr.children).forEach((el, i) => {
            const s = window.getComputedStyle(el);
            const r = el.getBoundingClientRect();
            lines.push(`  [${i}] <${el.tagName.toLowerCase()}> id="${el.id}" class="${el.className}"`);
            lines.push(`    position:${s.position} top:${s.top} left:${s.left} right:${s.right} bottom:${s.bottom}`);
            lines.push(`    rect: x=${Math.round(r.x)} y=${Math.round(r.y)} w=${Math.round(r.width)} h=${Math.round(r.height)}`);
          });
        } else {
          lines.push('  No shadow root found');
        }
      }

      document.getElementById('debug').innerHTML = lines.join('<br>');
    }

    [1000, 2000, 3000, 5000].forEach(d => setTimeout(inspect, d));
  </script>

</body>
</html>
