<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8x8 Smart Assist</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #EBEAE1;
      font-family: 'Archivo', sans-serif;
    }
    .logo {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #3A3A38;
      z-index: 10;
      white-space: nowrap;
    }
    .logo span { color: #04888A; }
  </style>
</head>
<body>

  <div class="logo">8<span>x</span>8<sup style="font-size:11px;vertical-align:super;">®</sup></div>

  <ai-studio-widget widget-id="wgt_teal_701dc7e0"></ai-studio-widget>
  <script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

  <script>
    function centerOrb() {
      const widget = document.querySelector('ai-studio-widget');
      if (!widget || !widget.shadowRoot) return false;

      const orbBtn = widget.shadowRoot.querySelector('.orb-button');
      if (!orbBtn) return false;

      // Inject override style targeting orb-button directly
      const existing = widget.shadowRoot.getElementById('orb-center');
      if (!existing) {
        const style = document.createElement('style');
        style.id = 'orb-center';
        style.textContent = `
          :host {
            position: fixed !important;
            bottom: auto !important;
            right: auto !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
          }
          .orb-button {
            position: static !important;
            bottom: auto !important;
            right: auto !important;
          }
        `;
        widget.shadowRoot.appendChild(style);
      }
      return true;
    }

    // Poll until orb-button exists
    const timer = setInterval(() => {
      if (centerOrb()) clearInterval(timer);
    }, 50);
  </script>

</body>
</html>
